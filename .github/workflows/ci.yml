name: ci

# Triggers:
#   - push to main / pull_request: lint + build (no release).
#   - push of a v* tag: lint + build, then release on success.
#   - workflow_dispatch: manual re-run; release only fires on a v* tag ref.
on:
  push:
    # GitHub trigger filter-patterns are not regex; the real release gate is the
    # job-level `if:` on the release job (refs/tags/v* startsWith).
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default; the release job elevates to contents: write at job scope
# so lint/build stay least-privilege.
permissions:
  contents: read

# Cancel superseded branch/PR runs; never cancel a tag run mid-publish, and give
# manual dispatches their own group so an unrelated push to main can't kill them.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: >-
    ${{ !startsWith(github.ref, 'refs/tags/')
        && github.event_name != 'workflow_dispatch' }}

env:
  OPENWRT_SDK_URL: https://downloads.openwrt.org/releases/25.12.4/targets/x86/64/openwrt-sdk-25.12.4-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  OPENWRT_SDK_SHA256: 28e004c1be4d215d19c1f12a6aa4c8d8f80689549eb707d0ff5a71f16fa8d05f
  OPENWRT_SDK_CACHE_KEY: openwrt-sdk-25.12.4-x86_64

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: alpine:edge
    steps:
      - name: Install lint tooling
        run: apk add --no-cache ucode nodejs grep findutils
      - uses: actions/checkout@v7
      - name: Static checks (JSON / JS / ucode syntax / house style)
        run: sh scripts/lint.sh

  build:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libncurses-dev libssl-dev python3 \
            unzip gawk gettext xsltproc rsync wget curl zstd file

      - name: Cache OpenWrt SDK
        uses: actions/cache@v5
        with:
          path: .sdk
          key: ${{ env.OPENWRT_SDK_CACHE_KEY }}-${{ env.OPENWRT_SDK_SHA256 }}

      - name: Build apk
        id: build
        env:
          SDK_URL: ${{ env.OPENWRT_SDK_URL }}
          SDK_SHA256: ${{ env.OPENWRT_SDK_SHA256 }}
          SDK_DIR: ${{ github.workspace }}/.sdk
        run: sh scripts/build-apk.sh

      - name: Upload apk artifact
        uses: actions/upload-artifact@v7
        with:
          name: luci-app-uapi-apk
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error

  # Attaches the apk to the GitHub Release. The signed apk feed at
  # openwrt-iac.github.io/feed/ is rebuilt by the aggregator's publish.yml, which
  # pulls the latest stable release asset from each source repo; this job just
  # makes sure a tagged commit has a downloadable, signed-tag-gated asset.
  release:
    runs-on: ubuntu-latest
    needs: [lint, build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need the tag object for verify-tag

      # Tags MUST be signed by a key in .github/release-signers.asc. An unsigned
      # tag, or one signed by a non-listed key, fails before anything is built.
      - name: Verify tag signature
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! grep -q 'BEGIN PGP PUBLIC KEY BLOCK' .github/release-signers.asc; then
            echo "ERROR: .github/release-signers.asc has no PGP public-key block."
            exit 1
          fi
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --import .github/release-signers.asc
          git verify-tag "$TAG"

      - name: Verify tag matches VERSION
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          WANT="v$(sed -n '1p' VERSION)"
          [ "$TAG" = "$WANT" ] || {
            echo "ERROR: tag $TAG does not match VERSION ($WANT). Bump VERSION/CHANGELOG before tagging."
            exit 1
          }

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libncurses-dev libssl-dev python3 \
            unzip gawk gettext xsltproc rsync wget curl zstd file

      - name: Cache OpenWrt SDK
        uses: actions/cache@v5
        with:
          path: .sdk
          key: ${{ env.OPENWRT_SDK_CACHE_KEY }}-${{ env.OPENWRT_SDK_SHA256 }}

      - name: Build apk
        id: build
        env:
          SDK_URL: ${{ env.OPENWRT_SDK_URL }}
          SDK_SHA256: ${{ env.OPENWRT_SDK_SHA256 }}
          SDK_DIR: ${{ github.workspace }}/.sdk
        run: sh scripts/build-apk.sh

      - name: Upload apk artifact
        uses: actions/upload-artifact@v7
        with:
          name: luci-app-uapi-apk
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error

      - name: Attach apk to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            case "$TAG" in
              # Semver: any tag with a hyphen is a pre-release (rc/alpha/beta/dev/...).
              *-*) PRE=--prerelease ;;
              *) PRE= ;;
            esac
            chmod +x scripts/release-notes.sh
            scripts/release-notes.sh "$TAG" > /tmp/release-notes.md
            if [ -s /tmp/release-notes.md ]; then
              gh release create "$TAG" $PRE --title "$TAG" --notes-file /tmp/release-notes.md
            else
              gh release create "$TAG" $PRE --title "$TAG" --generate-notes
            fi
          fi
          gh release upload "$TAG" "${{ steps.build.outputs.apk }}" --clobber
